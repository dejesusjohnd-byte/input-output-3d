<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input-Output3D // Studio Multi-Layer Suite</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        :root {
            --bg-dark: #05070f;
            --panel-dark: rgba(10, 15, 30, 0.75);
            --border-color: rgba(0, 255, 208, 0.15);
            --accent: #00ffd0;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            margin: 0; display: flex; width: 100vw; height: 100vh; overflow: hidden; 
            background: var(--bg-dark); color: var(--text-main); 
        }

        #sidebar {
            width: 360px; min-width: 360px;
            background: var(--panel-dark);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 20px;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
        }

        h1 { color: var(--accent); margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 13px; margin: 0; line-height: 1.5; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 10px; text-transform: uppercase; font-weight: 800; color: var(--text-muted); letter-spacing: 0.8px; }
        
        input[type="text"] {
            width: 100%; padding: 14px;
            border: 1px solid var(--border-color); border-radius: 12px;
            background: rgba(10, 15, 30, 0.8); color: white;
            outline: none; font-size: 14px; transition: all 0.3s ease;
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 255, 208, 0.2); }

        button {
            width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            background: var(--accent); color: #05070f;
            font-weight: 800; font-size: 14px; cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover { box-shadow: 0 0 20px rgba(0, 255, 208, 0.4); transform: translateY(-1px); }
        button:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }
        button:active { transform: translateY(0); }
        button.secondary { background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); }
        button.secondary:hover { background: rgba(30, 41, 59, 0.8); box-shadow: none; }

        #loading-panel {
            display: none; background: rgba(30, 41, 59, 0.2);
            border-radius: 12px; padding: 16px; border: 1px solid var(--border-color);
        }
        .progress-track { width: 100%; height: 6px; background: #02040a; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent); }
        #status-text { font-size: 11px; color: var(--accent); margin-top: 10px; font-family: monospace; line-height: 1.4; }

        #viewer { flex-grow: 1; position: relative; height: 100%; }
        #viewer canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        .controls-overlay {
            position: absolute; bottom: 30px; right: 30px;
            background: var(--panel-dark); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 15px 25px; display: flex; gap: 20px; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .control-item { display: flex; flex-direction: column; gap: 6px; width: 110px; }
        .control-item label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }
        .control-item input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        #toast {
            position: absolute; top: 30px; right: -320px;
            width: 280px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border-left: 4px solid var(--accent); border-radius: 8px;
            padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 4px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
        }
        #toast.active { right: 30px; }
        #toast-title { font-weight: 800; font-size: 13px; color: var(--accent); }
        #toast-desc { font-size: 12px; color: var(--text-main); }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 3, 6, 0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999;
        }
        #modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box {
            background: #090e1a; padding: 40px; border-radius: 20px;
            border: 1px solid var(--border-color); width: 380px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { width: 50px; height: 50px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 24px; }
        .modal-icon.info { background: rgba(0, 255, 208, 0.1); color: var(--accent); }
        .modal-box h2 { margin: 0 0 10px 0; font-size: 20px; font-weight: 800; }
        .modal-box p { color: var(--text-muted); margin: 0 0 25px 0; font-size: 14px; line-height: 1.5; }
    </style>
</head>

<body>
    <div id="sidebar">
        <div>
            <h1>Input-Output3D</h1>
            <p>Advanced dual-mask space reconstruction engine. Segmenting and assembling layered geometric tokens.</p>
        </div>

        <div class="input-group">
            <label>Brand Target Domain</label>
            <input id="urlInput" type="text" placeholder="e.g. google.com" autocomplete="off" />
        </div>

        <button onclick="generateLogo()">Assemble layered mesh</button>

        <div id="loading-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="loading-title" style="font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase;">Pipeline Status</span>
                <span id="percent-text" style="font-size: 10px; color: var(--text-muted); font-weight: 700;">0%</span>
            </div>
            <div class="progress-track"><div id="progress-bar"></div></div>
            <div id="status-text">Ready to request pipeline processing...</div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">

        <button class="secondary" onclick="toggleSpin()">Toggle Dynamic Rotation</button>
        <button class="secondary" onclick="resetPerspective()">Reset Perspective Angle</button>
    </div>

    <div id="viewer">
        <div class="controls-overlay">
            <div class="control-item">
                <label>Spin Speed</label>
                <input type="range" min="0" max="0.05" step="0.001" value="0.01" id="spinSpeed" />
            </div>
            <div class="control-item">
                <label>Mesh Scale</label>
                <input type="range" min="1" max="5" step="0.1" value="2.5" id="meshScale" oninput="updateTokenGeometry()" />
            </div>
        </div>
    </div>

    <div id="toast">
        <div id="toast-title">Security Alert</div>
        <div id="toast-desc">Firewall detected. Deploying smart fallback layer.</div>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon info">✦</div>
            <h2 id="modal-title">System Update</h2>
            <p id="modal-desc">Pipeline action triggered.</p>
            <button class="secondary" onclick="closeModal()">Dismiss</button>
        </div>
    </div>

    <script>
        function showModal(title, message) {
            const overlay = document.getElementById("modal-overlay");
            const heading = document.getElementById("modal-title");
            const text = document.getElementById("modal-desc");
            heading.innerText = title;
            text.innerText = message;
            overlay.classList.add("active");
        }
        function closeModal() {
            document.getElementById("modal-overlay").classList.remove("active");
        }

        function triggerToast(title, desc) {
            const banner = document.getElementById("toast");
            document.getElementById("toast-title").innerText = title;
            document.getElementById("toast-desc").innerText = desc;
            banner.classList.add("active");
            setTimeout(() => banner.classList.remove("active"), 4000);
        }

        const viewer = document.getElementById("viewer");
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x05070f);
        scene.fog = new THREE.Fog(0x05070f, 10, 30);
        
        const camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(viewer.clientWidth, viewer.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        viewer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
        keyLight.position.set(5, 8, 5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-5, 3, 5);
        scene.add(fillLight);

        const floorGeometry = new THREE.PlaneGeometry(50, 50);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x111827,
            metalness: 0.2,
            roughness: 0.8
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2.5;
        floor.receiveShadow = true;
        scene.add(floor);
        
        const gridHelper = new THREE.GridHelper(24, 44, 0x00ffd0, 0x13192e);
        gridHelper.position.y = -2.0;
        scene.add(gridHelper);

        let currentModelGroup = null;
        let autoSpin = true;

        function toggleSpin() { autoSpin = !autoSpin; }
        function resetPerspective() { controls.reset(); camera.position.set(0, 2, 8); }

        function createPlaceholder() {
            if (currentModelGroup) {
                scene.remove(currentModelGroup);
            }
            currentModelGroup = new THREE.Group();
            
            // Reconstructed clean faceted circle structure
            const geometry = new THREE.IcosahedronGeometry(1.5, 2); 
            
            const material = new THREE.MeshStandardMaterial({
                color: 0x00b39b,     // Refined tech blue-green
                emissive: 0x002b24,  // Deep glow shadow
                metalness: 0.3,
                roughness: 0.4,
                wireframe: true     // Clean structural connecting lines
            });

            const mesh = new THREE.Mesh(geometry, material);
            currentModelGroup.add(mesh);
            scene.add(currentModelGroup);
        }

        createPlaceholder();

        async function generateLogo() {
            const url = document.getElementById("urlInput").value.trim();
            if (!url) {
                showModal("Validation Error", "Please provide a valid website address to begin scanning.");
                return;
            }

            const actionButton = document.querySelector("button[onclick='generateLogo()']");
            if (actionButton) actionButton.disabled = true;

            createPlaceholder();

            const loader = document.getElementById("loading-panel");
            const bar = document.getElementById("progress-bar");
            const title = document.getElementById("loading-title");
            const status = document.getElementById("status-text");
            const percent = document.getElementById("percent-text");

            // Make sure panel is visible
            loader.style.display = "block";
            
            // STEP 1: INITIALIZE
            bar.style.width = "15%"; 
            percent.innerText = "15%";
            title.innerText = "INITIALIZING PIPELINE";
            status.innerText = "Connecting to target domain and checking security layers...";

            // Give the user time to read the status transition
            await new Promise(r => setTimeout(r, 800));
            
            // STEP 2: RUNNING / GENERATION ENGINE
            bar.style.width = "45%"; 
            percent.innerText = "45%";
            title.innerText = "PROCESSING FALLBACK ENGINE";
            status.innerText = "Target firewall active. Booting headless viewport fallback. Image payload transmitted to Tripo API. Building 3D mesh graphs (approx. 30s)...";

            try {
                const hostTarget = window.location.origin.includes('file://') ? "http://127.0.0.1:3000" : window.location.origin;
                
                // This execution stays active while terminal prints: [Tripo Monitor] Status: running
                const response = await fetch(`${hostTarget}/detect-brand`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.error) {
                    loader.style.display = "none";
                    showModal("Pipeline Failure", data.error);
                    return;
                }

                // STEP 3: DATA RETRIEVED FROM SERVER
                bar.style.width = "85%"; 
                percent.innerText = "85%";
                title.innerText = "COMPILING MESH STRUCTURE";
                status.innerText = "GLTF geometry stream received from server pipeline. Re-centering scene graphs...";

                await new Promise(r => setTimeout(r, 600));

                // STEP 4: FINALIZATION
                bar.style.width = "100%"; 
                percent.innerText = "100%";
                title.innerText = "ASSEMBLY COMPLETE";
                status.innerText = "Injecting finalized tokens into WebGL viewport container...";

                triggerToast("Mesh Ready", "Successfully generated 3D model geometry!");
                
                // Pass payload to Three.js builder
                buildLayeredMesh(data);

            } catch (err) {
                console.error(err);
                showModal("Network Failure", "Unable to establish backend pipeline connection.");
            } finally {
                if (actionButton) actionButton.disabled = false;
                // Fade loader panel out clean after a short delay
                setTimeout(() => { 
                    loader.style.display = "none"; 
                    bar.style.width = "0%"; 
                    percent.innerText = "0%";
                    title.innerText = "Pipeline Status";
                    status.innerText = "Ready to request pipeline processing...";
                }, 2000);
            }
        }
        function updateTokenGeometry() {
            if (!currentModelGroup) return;
            const scaleValue = parseFloat(document.getElementById("meshScale").value);
            currentModelGroup.scale.set(scaleValue, scaleValue, scaleValue);
        }

        function buildLayeredMesh(blueprint) {
            if (currentModelGroup) {
                scene.remove(currentModelGroup);
            }
            currentModelGroup = new THREE.Group();
            const loader = new THREE.GLTFLoader();

            loader.load(
                blueprint.meshUrl,
                function(gltf) {
                    const model = gltf.scene;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.metalness = 0.6;
                                child.material.roughness = 0.4;
                            }
                        }
                    });

                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.sub(center);

                    const size = box.getSize(new THREE.Vector3()).length();
                    const normalizeScale = 3.2 / size;
                    model.scale.set(normalizeScale, normalizeScale, normalizeScale);

                    currentModelGroup.add(model);
                    updateTokenGeometry();
                    scene.add(currentModelGroup);

                    controls.target.set(0, 0, 0);
                    controls.update();
                },
                function(xhr) {},
                function(error) {
                    console.error("GLTF Loader Error:", error);
                    showModal("Viewer Error", "Failed loading generated 3D model geometry.");
                }
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (currentModelGroup && autoSpin) {
                const speed = parseFloat(document.getElementById("spinSpeed").value);
                currentModelGroup.rotation.y += speed;
            }
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", () => {
            camera.aspect = viewer.clientWidth / viewer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewer.clientWidth, viewer.clientHeight);
        });
    </script>
</body>
</html>
