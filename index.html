<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Logo to 3D Engine</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-dark: rgba(6, 10, 20, 0.85);
            --border-color: rgba(0, 255, 208, 0.15);
            --accent: #00ffd0;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --warning-red: #f43f5e;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body { 
            margin: 0; display: flex; width: 100vw; height: 100vh; overflow: hidden; 
            background: var(--bg-dark); color: var(--text-main); 
        }

        #sidebar {
            width: 360px; min-width: 360px;
            background: var(--panel-dark);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 18px;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0,0,0,0.6);
            overflow-y: auto;
        }

        h1 { color: var(--accent); margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 12px; margin: 0; line-height: 1.5; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 10px; text-transform: uppercase; font-weight: 800; color: var(--text-muted); letter-spacing: 0.8px; }
        
        input[type="text"] {
            width: 100%; padding: 12px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: rgba(5, 7, 15, 0.9); color: white;
            outline: none; font-size: 13px; transition: all 0.3s ease;
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 255, 208, 0.15); }

        button {
            width: 100%; padding: 12px;
            border: none; border-radius: 8px;
            background: var(--accent); color: #05070f;
            font-weight: 800; font-size: 13px; cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover { box-shadow: 0 0 20px rgba(0, 255, 208, 0.3); transform: translateY(-1px); }
        button:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }

        button.secondary { background: rgba(30, 41, 59, 0.3); color: var(--text-main); border: 1px solid var(--border-color); margin-top: 2px; }
        button.secondary:hover { background: rgba(30, 41, 59, 0.6); }

        #loading-panel {
            display: none; background: rgba(10, 15, 30, 0.6);
            border-radius: 8px; padding: 14px; border: 1px solid var(--border-color);
        }
        .progress-track { width: 100%; height: 5px; background: #02040a; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent); }
        #status-text { font-size: 11px; color: var(--accent); margin-top: 8px; font-family: monospace; line-height: 1.4; }
        
        #download-box { 
            margin-top: 10px; display: none; background: rgba(0, 255, 208, 0.08); 
            border: 1px dashed var(--accent); padding: 10px; border-radius: 6px; text-align: center;
        }
        #download-box a { color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 700; display: block; }

        #billing-badge {
            margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 8px; border-radius: 4px; font-size: 10px; font-weight: 800;
            text-transform: uppercase; background: rgba(255, 255, 255, 0.04); color: var(--text-muted);
        }
        #billing-badge.charged { background: rgba(244, 63, 94, 0.1); color: var(--warning-red); }

        #viewer { flex-grow: 1; position: relative; height: 100%; }
        #viewer canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        .controls-overlay {
            position: absolute; bottom: 25px; right: 25px;
            background: var(--panel-dark); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 15px 20px; display: flex; gap: 15px; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .control-item { display: flex; flex-direction: column; gap: 6px; width: 110px; }
        .control-item label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .control-item input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 3, 6, 0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999;
        }
        #modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box {
            background: #090e1a; padding: 35px; border-radius: 16px;
            border: 1px solid var(--border-color); width: 360px; text-align: center;
        }
        .modal-icon { width: 45px; height: 45px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 22px; }
        .modal-icon.warn { background: rgba(244, 63, 94, 0.1); color: #f43f5e; }
        .modal-box h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 800; }
        .modal-box p { color: var(--text-muted); margin: 0 0 20px 0; font-size: 13px; line-height: 1.5; }
    </style>
</head>

<body>
    <div id="sidebar">
        <div>
            <h1>URL to 3D Model</h1>
            <p>Enter a web address below to pull its logo and transform it into a textured 3D asset file.</p>
        </div>

        <div class="input-group">
            <label>Target Website URL</label>
            <input id="urlInput" type="text" placeholder="e.g. facebook.com" autocomplete="off" />
        </div>

        <button onclick="generateLogo()">Generate 3D Model</button>

        <div id="loading-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="loading-title" style="font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase;">Status Log</span>
                <span id="percent-text" style="font-size: 10px; color: var(--text-muted); font-weight: 700;">0%</span>
            </div>
            <div class="progress-track"><div id="progress-bar"></div></div>
            <div id="status-text">Starting pipeline...</div>
            
            <div id="download-box">
                <a id="download-link" href="#" target="_blank">📥 Download Asset (.GLB)</a>
            </div>
            
            <div id="billing-badge">● API Connection: Checking...</div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">

        <div class="input-group">
            <label>Ambient Light Intensity</label>
            <input type="range" min="0.1" max="4.0" step="0.1" value="0.5" id="ambientIntensity" oninput="updateStudioLighting()" />
        </div>
        <div class="input-group">
            <label>Direct Key Lighting</label>
            <input type="range" min="0.5" max="5.0" step="0.1" value="1.8" id="keyIntensity" oninput="updateStudioLighting()" />
        </div>
        <div class="input-group">
            <label>Background Studio Tone</label>
            <input type="range" min="10" max="150" step="5" value="15" id="studioTone" oninput="updateStudioBackground()" />
        </div>

        <button class="secondary" onclick="toggleSpin()">Toggle Auto-Rotation</button>
        <button class="secondary" onclick="resetPerspective()">Reset Camera View</button>
    </div>

    <div id="viewer">
        <div class="controls-overlay">
            <div class="control-item">
                <label>Spin Speed</label>
                <input type="range" min="0" max="0.05" step="0.001" value="0.01" id="spinSpeed" />
            </div>
            <div class="control-item">
                <label>Scale Factor</label>
                <input type="range" min="0.5" max="4" step="0.1" value="2.0" id="meshScale" oninput="updateTokenGeometry()" />
            </div>
            <div class="control-item">
                <label>Grid Offset</label>
                <input type="range" min="-4.0" max="0.0" step="0.05" value="-1.5" id="gridHeight" oninput="adjustGridHeight()" />
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon warn">⚠️</div>
            <h2 id="modal-title" style="color: #f43f5e;">Alert</h2>
            <p id="modal-desc"></p>
            <button class="secondary" onclick="closeModal()">Dismiss</button>
        </div>
    </div>

    <script>
        function showModal(title, message) {
            const overlay = document.getElementById("modal-overlay");
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-desc").innerText = message;
            overlay.classList.add("active");
        }
        
        function closeModal() { document.getElementById("modal-overlay").classList.remove("active"); }

        const viewer = document.getElementById("viewer");
        const scene = new THREE.Scene();
        
        const baseColor = 0x0f1422; 
        scene.background = new THREE.Color(baseColor);
        scene.fog = new THREE.FogExp2(baseColor, 0.03);
        
        const camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(viewer.clientWidth, viewer.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        viewer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01; // Prevents camera going beneath grid floor

        // REMODELED STUDIO THREE-POINT LIGHTING SETUP
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
        keyLight.position.set(5, 6, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.001;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(-5, 3, 2);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0x00ffd0, 1.2);
        rimLight.position.set(0, 4, -5);
        scene.add(rimLight);

        let currentGridY = -1.5;
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.2 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = currentGridY - 0.01;
        floor.receiveShadow = true;
        scene.add(floor);
        
        const gridHelper = new THREE.GridHelper(40, 60, 0x00ffd0, 0x1e293b);
        gridHelper.position.y = currentGridY;
        scene.add(gridHelper);

        let currentModelGroup = null;
        let autoSpin = true;

        function toggleSpin() { autoSpin = !autoSpin; }
        
        function resetPerspective() { 
            controls.reset(); 
            if (currentModelGroup) {
                fitCameraToObject(currentModelGroup);
            } else {
                camera.position.set(0, 1.5, 6); 
            }
        }

        function adjustGridHeight() {
            const selectedHeight = parseFloat(document.getElementById("gridHeight").value);
            currentGridY = selectedHeight;
            gridHelper.position.y = currentGridY;
            floor.position.y = currentGridY - 0.01;
            
            // Recalibrate and ground active meshes on value sliding mutations
            if (currentModelGroup) {
                groundAndCenterMesh(currentModelGroup);
            }
        }

        function updateStudioLighting() {
            ambientLight.intensity = parseFloat(document.getElementById("ambientIntensity").value);
            keyLight.intensity = parseFloat(document.getElementById("keyIntensity").value);
        }

        function updateStudioBackground() {
            const val = parseInt(document.getElementById("studioTone").value);
            const colorStr = `rgb(${val},${val+4},${val+12})`; // Preserves original slate-blue shadow profile
            const newColor = new THREE.Color(colorStr);
            scene.background = newColor;
            scene.fog.color = newColor;
        }

        function groundAndCenterMesh(group) {
            // Reset position configurations first
            group.position.set(0, 0, 0);

            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            
            // Shift geometry center cleanly across horizontal landscape axes
            group.position.x = -center.x;
            group.position.z = -center.z;
            
            // Align the bottom bounds precisely over the grid plane elevation point
            group.position.y = currentGridY - box.min.y;
            controls.update();
        }

        function createPlaceholder() {
            if (currentModelGroup) scene.remove(currentModelGroup);
            currentModelGroup = new THREE.Group();
            const geometry = new THREE.IcosahedronGeometry(1.2, 2); 
            const material = new THREE.MeshStandardMaterial({ color: 0x00ffd0, wireframe: true });
            const mesh = new THREE.Mesh(geometry, material);
            currentModelGroup.add(mesh);
            scene.add(currentModelGroup);
            groundAndCenterMesh(currentModelGroup);
        }
        createPlaceholder();

        function updateTokenGeometry() {
            if (!currentModelGroup) return;
            const size = parseFloat(document.getElementById("meshScale").value);
            currentModelGroup.scale.set(size / 2, size / 2, size / 2);
            groundAndCenterMesh(currentModelGroup);
        }

        // LOOKBOOK CAMERA AUTO-LEVELS FORMULATION ENGINE
        function fitCameraToObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fovRad = camera.fov * (Math.PI / 180);
            
            // Calculate pristine distance matching product presentation framing styles
            let cameraZ = maxDim / (2 * Math.tan(fovRad / 2));
            cameraZ *= 1.5; // Padding margin adjustment value

            // Frame camera right above look center vector profiles
            camera.position.set(maxDim * 0.2, center.y + (size.y * 0.1), cameraZ);
            
            // Point target strictly onto calculated object core center limits
            controls.target.copy(center);
            camera.updateProjectionMatrix();
            controls.update();
        }

        async function generateLogo() {
            const url = document.getElementById("urlInput").value.trim();
            if (!url) {
                showModal("Input Needed", "Please provide a valid website domain link.");
                return;
            }

            const actionButton = document.querySelector("button[onclick='generateLogo()']");
            if (actionButton) actionButton.disabled = true;

            createPlaceholder();

            const loader = document.getElementById("loading-panel");
            const bar = document.getElementById("progress-bar");
            const title = document.getElementById("loading-title");
            const status = document.getElementById("status-text");
            const percent = document.getElementById("percent-text");
            const billingBadge = document.getElementById("billing-badge");
            const downloadBox = document.getElementById("download-box");

            loader.style.display = "block";
            downloadBox.style.display = "none";
            bar.style.width = "0%"; 
            percent.innerText = "0%";
            title.innerText = "Initializing...";
            status.innerText = "Scraping target domain and analyzing asset fields...";
            billingBadge.className = "";
            billingBadge.innerText = "● Tokens: Checking status...";

            try {
                const hostTarget = window.location.origin.includes('file://') ? "http://127.0.0.1:3000" : window.location.origin;
                
                const response = await fetch(`${hostTarget}/detect-brand`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                if (data.error) {
                    loader.style.display = "none";
                    showModal("Pipeline Stopped", data.error);
                    if (actionButton) actionButton.disabled = false;
                    return;
                }

                const outputFolder = data.outputFolder;

                if (data.charged) {
                    billingBadge.className = "charged";
                    billingBadge.innerText = "⚠️ Tripo Tokens Charged";
                } else if (data.isCached) {
                    billingBadge.className = "";
                    billingBadge.innerText = "♻️ Restored from Cache (Free)";
                }

                const taskId = data.taskId;
                let isComplete = false;

                while (!isComplete) {
                    await new Promise(resolve => setTimeout(resolve, 3000));

                    const pollResponse = await fetch(`${hostTarget}/task-status/${taskId}`);
                    const pollData = await pollResponse.json();

                    if (pollData.error) throw new Error(pollData.error);

                    const apiProgress = pollData.progress || 0;
                    bar.style.width = `${apiProgress}%`;
                    percent.innerText = `${apiProgress}%`;
                    title.innerText = `Tripo AI Pipeline Running`;
                    status.innerText = `Status: ${pollData.status.toUpperCase()}`;

                    if (pollData.status === "success" || pollData.status === "succeeded") {
                        isComplete = true;
                        
                        if (!pollData.modelUrl) {
                            throw new Error("Tripo reported success but asset link was not resolved.");
                        }

                        document.getElementById("download-link").href = pollData.modelUrl;
                        downloadBox.style.display = "block";

                        title.innerText = "Archiving Model";
                        status.innerText = "Downloading persistent files directly to local storage...";
                        
                        try {
                            await fetch(`${hostTarget}/backup-model`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ modelUrl: pollData.modelUrl, outputFolder })
                            });
                        } catch (backupErr) { console.error("Local save error:", backupErr); }

                        title.innerText = "Rendering Viewport";
                        status.innerText = "Streaming structural GLB mesh blocks to WebGL canvas...";
                        
                        const gltfLoader = new THREE.GLTFLoader();
                        gltfLoader.load(`${hostTarget}/fetch-model?url=${encodeURIComponent(pollData.modelUrl)}`, (gltf) => {
                            if (currentModelGroup) scene.remove(currentModelGroup);
                            
                            currentModelGroup = gltf.scene;
                            
                            currentModelGroup.traverse((node) => {
                                if (node.isMesh) {
                                    node.castShadow = true;
                                    node.receiveShadow = true;
                                    if (node.material) {
                                        node.material.roughness = 0.3;
                                        node.material.metalness = 0.6;
                                        node.material.side = THREE.DoubleSide;
                                        if (node.material.map) {
                                            node.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                                        }
                                    }
                                }
                            });
                            
                            scene.add(currentModelGroup);
                            updateTokenGeometry(); // Runs bounding calibration adjustments automatically
                            fitCameraToObject(currentModelGroup); // Locks focal points neatly inside product layout bounds
                            
                            title.innerText = "Complete";
                            status.innerText = "Pipeline finished. 3D Model loaded stably.";
                            if (actionButton) actionButton.disabled = false;
                        }, undefined, (gltfError) => {
                            showModal("ThreeJS Load Error", "Failed rendering GLB model: " + gltfError.message);
                            if (actionButton) actionButton.disabled = false;
                        });
                    } else if (pollData.status === "failed") {
                        throw new Error("Tripo remote generator returned a processing failure code.");
                    }
                }
            } catch (err) {
                loader.style.display = "none";
                showModal("Pipeline Error", err.message);
                if (actionButton) actionButton.disabled = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (autoSpin && currentModelGroup) {
                const speed = parseFloat(document.getElementById("spinSpeed").value) || 0.01;
                currentModelGroup.rotation.y += speed;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener("resize", () => {
            camera.aspect = viewer.clientWidth / viewer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewer.clientWidth, viewer.clientHeight);
        });

        animate();
    </script>
</body>
</html>
